[project]
name = "aion2-timerbot"
version = "1.0.0"
description = "A Discord bot for setting and showing Aion 2 timers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
    "aiosqlite>=0.19",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aion2-timerbot = "bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aion2_timerbot", "aion2_timerbot.cogs"]
py-modules = ["bot"]

[tool.setuptools.package-data]
aion2_timerbot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
